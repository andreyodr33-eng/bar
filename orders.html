<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Orders</title>
  <style>
.logout-btn {
  position: fixed;
  top: 10px;
  right: 10px;
  background: red;
  color: white;
  border: none;
  font-size: 18px;
  padding: 6px 10px;
  cursor: pointer;
  border-radius: 4px;
  z-index: 1000;
}

.logout-btn:hover {
  background: darkred;
}
</style>
</head>
<body>
<script>
  const pass = prompt("Enter admin password:");

  if (pass !== "12345") {
    document.body.innerHTML = "<h2>Access denied</h2>";
    throw new Error("Access denied");
  }
</script>


<h2>Orders</h2>
<div style="margin-bottom:10px;">  
<button onclick="archiveAndClear()">💾 Сохранить</button>
<button onclick="clearOrders()">🧹 Очистить базу</button>
<button onclick="logout()" class="logout-btn">x</button> 
</div>  
<table border="1" width="100%" style="border-collapse:collapse;">
  <thead>
    <tr>
      <th onclick="sortTable('id')">ID</th>
      <th onclick="sortTable('type')">Type</th>
      <th onclick="sortTable('table')">Table</th>
      <th onclick="sortTable('items')">Items</th>
      <th onclick="sortTable('name')">Name</th>
      <th onclick="sortTable('phone')">Phone</th>
      <th onclick="sortTable('address')">Address</th>
      <th onclick="sortTable('time')">Time</th>
    </tr>
  </thead>
  <tbody id="orders"></tbody>
</table>
<script>

let currentData = [];

// 🔍 Разбор текста заказа
function parseOrder(text) {

  function extract(label) {
    const match = text.match(new RegExp(label + ":\\s*([^\\n]+)"));
    let value = match ? match[1].trim() : "";

    // ❗ фильтр мусора
    if (
      !value ||
      value === label ||
      value.includes ("Name") ||
      value.includes ("Phone") ||
      value.includes ("Address") ||
      value.includes("Table:")
    ) {
      return "";
    }

    return value;
  }

  return {
    type: (text.match(/\[(.*?)\]/) || [])[1] || "",

    items: (text.split("Name:")[0] || "")
      .replace("🛒 ORDER", "")
      .trim(),

    name: extract("Name"),
    phone: extract("Phone"),
    address: extract("Address"),
    time: extract("Time")
  };
}

// 📊 Отрисовка таблицы
function renderTable(data) {
  const tbody = document.getElementById('orders');
  tbody.innerHTML = "";

  data.forEach(o => {
    const row = document.createElement('tr');

    row.innerHTML = `
      <td>${o.id}</td>
      <td>${o.type}</td>
      <td>${o.items}</td>
      <td>${o.name}</td>
      <td>${o.phone}</td>
      <td>${o.address}</td>
      <td>${o.time}</td>
    `;

    tbody.appendChild(row);
  });
}

// 🔃 Сортировка
function sortTable(field) {

  let sorted = [...currentData];

  sorted.sort((a, b) => {

    if (field === "id") return b.id - a.id;

    let x = (a[field] || "").toLowerCase();
    let y = (b[field] || "").toLowerCase();

    return x.localeCompare(y);
  });

  renderTable(sorted);
}

// 🌐 Загрузка данных
fetch("https://my-worker.andreyodr33.workers.dev/get-orders", {
  headers: {
    "Authorization": "Bearer 12345"
  }
})
.then(r => r.json())
.then(data => {

  currentData = data.map(o => {
    const parsed = parseOrder(o.text);
    return { id: o.id, ...parsed };
  });

  // 👉 авто-сортировка при загрузке (новые сверху)
  currentData.sort((a, b) => b.id - a.id);

  renderTable(currentData);

});

</script>
<script>
function archiveAndClear() {

  if (!confirm("Архивировать и очистить заказы?")) return;

  let csv = "ID,Type,Items,Name,Phone,Address,Time\n";

  currentData.forEach(o => {
    csv += `${o.id},${o.type},${o.items},${o.name},${o.phone},${o.address},${o.time}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = `orders_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();

  URL.revokeObjectURL(url);

  currentData = [];
  renderTable([]);

  alert("Архив сохранён и таблица очищена");
}
</script>
<script>
function clearOrders() {

  if (!confirm("Удалить ВСЕ заказы?")) return;

  fetch("https://my-worker.andreyodr33.workers.dev/clear-orders", {
    method: "POST",
    headers: {
      "Authorization": "Bearer 12345"
    }
  })
  .then(() => {
    location.reload(); // обновить таблицу
  });
}
</script>
  <script>
function logout() {
  localStorage.removeItem("admin_auth");
  window.location.href = "/bar/"; 
}
</script>
</body>
</html>
