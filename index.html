let menuData = [];

document.addEventListener('DOMContentLoaded', function () {

  const menuContainer = document.querySelector('.menu');
  const buttons = document.querySelectorAll('.filter-btn');

  const sheetUrl =
  'https://opensheet.elk.sh/1PAi1zXz-S8jXxkUJHSeR22rrm6eyjjIkks_kyZ0vSgY/PizzaMenu';

  fetch(sheetUrl)
    .then(res => res.json())
    .then(menu => {

      menuData = menu;
      window.menuData = menu;

      console.log("menuData:", menuData);

      renderMenu(menuData);
      initFilters();

    })
    .catch(err => {

      console.warn("Google Sheets недоступны, используется резервное меню");

      menuData = backupMenu;
      window.menuData = backupMenu;

      renderMenu(menuData);
      initFilters();

    });


  // ===== РЕНДЕР МЕНЮ =====

  function renderMenu(menu) {

    menuContainer.innerHTML = '';

    menu.forEach(dish => {

      const card = document.createElement('div');
      card.fullDesc = dish.desc ? dish.desc : "";
      const isMobile = window.innerWidth < 576;

     const fullDesc = dish.desc || '';
     const shortDesc = dish.desc
     ? dish.desc.slice(0, 40) + (dish.desc.length > 40 ? '...' : '')
     : '';

     card.className ='card p-2 d-flex align-items-center';

      card.classList.add("card-zoom");
      card.onclick = () => toggleZoom(card);

      card.style.maxWidth = '600px';
      card.style.margin = '0 auto';
      card.style.flexDirection = 'row';
      card.style.gap = '10px';


      card.innerHTML = `

        <img src="${dish.img}" class="dish-img">
        
       <div style="
             flex:1;
             display:flex;
             flex-direction:column;
             justify-content:center;
             overflow-wrap: break-word;
             min-width:0;">
          <h6 class="mb-1">${dish.name}</h6>
          
          <small class="desc">${isMobile ? shortDesc : fullDesc}</small>
        </div>


        <div style="
             display:flex;
             flex-direction:column;
             justify-content:center;
             align-items:flex-end;
             min-width:90px;
             flex-shrink:0;">
         <strong>€${dish.price}</strong>

          <button class="btn btn-primary btn-sm"
          onclick="event.stopPropagation(); sendOrder('${dish.name}','${dish.price}')">
          Order
          </button>
        </div>
        `;

      menuContainer.appendChild(card);

    });

  }


  // ===== ФИЛЬТРЫ =====

  function initFilters() {

    buttons.forEach(btn => {

      btn.addEventListener('click', () => {

        const category = btn.dataset.category;

        if (category === "Все") {

          renderMenu(menuData);

        } else {

          const filtered =
          menuData.filter(
            d => d.category === category
          );

          renderMenu(filtered);

        }

      });

    });

  }

});

</script>

<script>

// КОРЗИНА

document.addEventListener('DOMContentLoaded', function() {

  const cartBox   = document.getElementById('cartBox');
  const cartItems = document.getElementById('cartItems');
  const cartTotal = document.getElementById('cartTotal');
  const clearBtn  = document.getElementById('clearCartBtn');
  const sendBtn   = document.getElementById('sendCartBtn');

   const checkboxes =
    document.querySelectorAll('input[type="checkbox"]');

 window.cart = [];

  const nameInput  = document.getElementById('custName');
  const phoneInput = document.getElementById('custPhone');
  const addrInput  = document.getElementById('custAddr');

 
  function updateCustomerFields() {

//==== функция скрытых полей ====

 const cb = document.querySelector('input[type="checkbox"]:checked');

  if(!cb) return;

  const type =
    cb.parentElement.textContent.trim();

  if(type.includes("Delivery")) {

    nameInput.style.display  = "block";
    phoneInput.style.display = "block";
    addrInput.style.display  = "block";

  } else {

    nameInput.style.display  = "none";
    phoneInput.style.display = "none";
    addrInput.style.display  = "none";

  }

}
  /* ---------- СТИЛИ КОРЗИНЫ ---------- */

  cartBox.style.transition = 'all 0.4s ease';
  cartBox.style.position = 'fixed';
  cartBox.style.bottom = '20px';
  cartBox.style.left = '50%';
  cartBox.style.transform = 'translate(-50%,80px) scale(0.9)';
  cartBox.style.opacity = '0';
  cartBox.style.width = '320px';

  cartBox.style.background = '#28a745';
  cartBox.style.color = '#fff';
  cartBox.style.borderRadius = '8px';
  cartBox.style.padding = '10px';
  cartBox.style.zIndex = '999';
  cartBox.style.display = 'block';



  /* ---------- ДОБАВИТЬ В КОРЗИНУ ---------- */

  window.addToCart = function(name, price) {
      const cb = document.querySelector('input[type="checkbox"]:checked');
      const type = cb ? cb.parentElement.textContent.trim() : "Unknown";
    cart.push({
      name,
      price: parseFloat(price),
      type
    });

    updateCartDisplay();

  }



  /* ---------- ПРОВЕРКА ЧЕКБОКСОВ ---------- */

  function isAnyChecked() {

    return document.querySelector(
      'input[type="checkbox"]:checked'
    );

  }



  /* ---------- ОБНОВЛЕНИЕ КОРЗИНЫ ---------- */

  function updateCartDisplay() {

    if(!isAnyChecked()) {

      cartBox.style.opacity = '0';
      cartBox.style.transform =
        'translate(-50%,80px) scale(0.9)';

      return;

    }

    cartBox.style.opacity = '1';
    cartBox.style.transform =
      'translate(-50%,0) scale(1)';


    cartItems.innerHTML = '';

    cart.forEach((item, idx) => {

      const div = document.createElement('div');

      div.style.display = 'flex';
      div.style.justifyContent = 'space-between';
      div.style.alignItems = 'center';
      div.innerHTML = `
         <span>[${item.type}] ${item.name} €${item.price.toFixed(2)}</span> 
         <button data-idx="${idx}">X</button>
        `;
        
      cartItems.appendChild(div);

    });


    const total =
      cart.reduce(
        (s,i)=>s+i.price,
        0
      );

    cartTotal.textContent =
      "Total: €" + total.toFixed(2);

  }



  /* ---------- УДАЛИТЬ ТОВАР ---------- */

  cartItems.addEventListener(
    'click',
    function(e) {

      const btn =
        e.target.closest('button');

      if(!btn) return;

      const idx =
        parseInt(btn.dataset.idx);

      cart.splice(idx,1);

      updateCartDisplay();

    }
  );



  /* ---------- ОЧИСТИТЬ ---------- */

  clearBtn.addEventListener(
    'click',
    function() {

      cart = [];

      cartItems.innerHTML = '';
      cartTotal.textContent =
        "Total: €0.00";

    }
  );



  /* ---------- ОТПРАВКА ---------- */

  sendBtn.addEventListener('click', function() {

  // Получаем элементы
  const cartMsg   = document.getElementById('cartMsg');
  const nameInput  = document.getElementById('custName');
  const phoneInput = document.getElementById('custPhone');
  const addrInput  = document.getElementById('custAddr');

  // Сбрасываем предыдущее сообщение
  cartMsg.style.display = "none";
  cartMsg.textContent = "";

  if(cart.length === 0) {
    cartMsg.style.display = "block";
    cartMsg.style.color = "red";
    cartMsg.textContent = "❌ Cart is empty";
    return;
  }

  const name  = nameInput.value.trim();
  const phone = phoneInput.value.trim();
  const addr  = addrInput.value.trim();

  const checkedBoxes = Array.from(document.querySelectorAll('input[type="checkbox"]:checked'));
  const anyDelivery = checkedBoxes.some(cb => cb.parentElement.textContent.includes("Delivery"));

  // Проверка только для Delivery
  if(anyDelivery && (!name || !phone || !addr)) {
    cartMsg.style.display = "block";
    cartMsg.style.color = "red";
    cartMsg.textContent = "❌ Pleas complete all delivery fields";
    return;
  }

  // Формируем список товаров
  let items = cart.map(i => `[${i.type}] ${i.name} €${i.price.toFixed(2)}`).join("\n");

  const message = `🛒 ORDER
${items}
Name: ${name}
Phone: ${phone}
Address: ${addr}
Table: ${tableNumber}
Time: ${new Date().toLocaleString()}`;
        
const time = new Date().toLocaleString();
  fetch("https://my-worker.andreyodr33.workers.dev", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({text: message,items: items,name: name,phone: phone,address: addr,type: getOrderType(),time: time})
  })
  
  .then(() => {
    cartMsg.style.display = "block";
    cartMsg.style.color = "#00ff88";
    cartMsg.textContent = "✅ Thank you! Your order is being processed";

    // Очистка корзины
    cart = [];
    cartItems.innerHTML = "";
    cartTotal.textContent = "Total: €0.00";

    setTimeout(() => { cartMsg.style.display = "none"; }, 2000);
  })
  .catch(() => {
    cartMsg.style.display = "block";
    cartMsg.style.color = "red";
    cartMsg.textContent = "❌ Sending error";
  });

});
 /* ---------- СЛУШАЕМ ВСЕ ЧЕКБОКСЫ ---------- */

  checkboxes.forEach(cb => {

  cb.addEventListener('change', function() {
    updateCartDisplay();
    updateCustomerFields();
  });

});
 updateCustomerFields();
});

</script>

 <script> 
  function toggleZoom(card) {

  const isActive = card.classList.contains("active");
  const desc = card.querySelector(".desc");

  if (!isActive) {

    card.classList.add("active");

    // 👉 полный текст
    desc.textContent = card.fullDesc;

    document.body.style.overflow = "hidden";

  } else {

    card.classList.remove("active");

    const isMobile = window.innerWidth < 576;

    // 👉 возвращаем как было
    const short = card.fullDesc.slice(0, 60) +
      (card.fullDesc.length > 60 ? "..." : "");

    desc.textContent = isMobile ? short : card.fullDesc;

    document.body.style.overflow = "";
  }
}

window.addEventListener(
    "load",
    ()=>{

        setTimeout(
            ()=>{

                document
                    .getElementById(
                        "splash"
                    )
                    .style.display =
                    "none";

            },

            1000

        );

    }
);
